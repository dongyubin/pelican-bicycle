<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑自行车 · 2D SVG 动画</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(circle at 50% 25%, #1b2434 0%, #0a0d13 70%);
    display: flex; align-items: center; justify-content: center;
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: min(96vw, calc(94vh * 12 / 7));
    aspect-ratio: 12 / 7;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 34px 90px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.07);
    background: #8fd3f4;
  }
  .stage > svg { display: block; width: 100%; height: 100%; }
  .hud { position: absolute; left: 20px; top: 18px; color: #fff; pointer-events: none; text-shadow: 0 2px 12px rgba(0,0,0,.45); }
  .hud b { display: block; font-size: 24px; letter-spacing: .08em; }
  .hud span { font-size: 12px; letter-spacing: .18em; opacity: .78; }

  /* 视差滚动：背景以不同速度平移，周期与内容平铺周期严格一致 */
  .drift { transform-box: view-box; transform-origin: 0 0; }
  .spin  { transform-box: fill-box; transform-origin: center; }
  .d1200 { animation: drift1200 110s linear infinite; }
  .d600  { animation: drift600 88s linear infinite; }
  .d600f { animation: drift600 26s linear infinite; }
  .d600m { animation: drift600 13s linear infinite; }
  .d200  { animation: drift200 .8s linear infinite; }
  @keyframes drift1200 { to { transform: translateX(-1200px); } }
  @keyframes drift600  { to { transform: translateX(-600px); } }
  @keyframes drift200  { to { transform: translateX(-200px); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.57s linear infinite; }
  .rays  { animation: spin 46s linear infinite; }
  .flag  { transform-box: fill-box; transform-origin: left center; animation: flap 1.1s ease-in-out infinite; }
  @keyframes flap { 0%,100% { transform: rotate(-7deg) skewY(4deg); } 50% { transform: rotate(9deg) skewY(-4deg); } }

  .streak { animation: streak 1.6s ease-in-out infinite; }
  @keyframes streak { 0%, 100% { opacity: 0; } 40%, 60% { opacity: .5; } }
</style>
</head>
<body>
<div class="stage">
  <svg id="scene" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">

    <defs>
      <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3f9fe0"/>
        <stop offset=".5" stop-color="#a5d9f4"/>
        <stop offset="1" stop-color="#ffe3bd"/>
      </linearGradient>
      <linearGradient id="gHillFar" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#a8cfd0"/><stop offset="1" stop-color="#7fb0b2"/>
      </linearGradient>
      <linearGradient id="gHillNear" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#86b878"/><stop offset="1" stop-color="#5d9268"/>
      </linearGradient>
      <linearGradient id="gRoad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#757680"/><stop offset="1" stop-color="#4c4d56"/>
      </linearGradient>
      <linearGradient id="gGrass" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7cb069"/><stop offset="1" stop-color="#5d9159"/>
      </linearGradient>
      <radialGradient id="gSunGlow">
        <stop offset="0" stop-color="#fff5c2" stop-opacity=".95"/>
        <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="gSunBody">
        <stop offset="0" stop-color="#fff9dd"/><stop offset="1" stop-color="#ffc94d"/>
      </radialGradient>

      <!-- 远山单元（宽 600，两端等高可无缝平铺） -->
      <g id="hillFarRow">
        <path d="M0 498 C90 396 210 376 300 442 C380 494 470 504 600 498 Z" fill="url(#gHillFar)"/>
      </g>
      <g id="hillNearRow">
        <path d="M0 502 C120 425 240 415 332 467 C404 507 500 511 600 502 Z" fill="url(#gHillNear)"/>
      </g>

      <!-- 树 -->
      <g id="treeA">
        <rect x="-4" y="-18" width="8" height="20" rx="3" fill="#6b4a30"/>
        <circle cx="0" cy="-28" r="17" fill="#4d8b5c"/>
        <circle cx="-13" cy="-19" r="12" fill="#5c9c68"/>
        <circle cx="13" cy="-19" r="12" fill="#5c9c68"/>
        <circle cx="0" cy="-35" r="12" fill="#63a870"/>
      </g>
      <g id="treeB">
        <rect x="-5" y="-14" width="10" height="16" rx="3" fill="#6b4a30"/>
        <path d="M0 -58 L16 -26 H-16 Z" fill="#47875a"/>
        <path d="M0 -44 L20 -6 H-20 Z" fill="#57a06a"/>
      </g>
      <g id="treeC">
        <rect x="-3.5" y="-12" width="7" height="14" rx="3" fill="#6b4a30"/>
        <ellipse cx="0" cy="-24" rx="20" ry="15" fill="#4f9160"/>
        <ellipse cx="-7" cy="-30" rx="11" ry="9" fill="#63a870"/>
      </g>
      <g id="treeRow">
        <use href="#treeA" transform="translate(60 500)"/>
        <use href="#treeB" transform="translate(212 500)"/>
        <use href="#treeC" transform="translate(372 500)"/>
        <use href="#treeA" transform="translate(520 500) scale(.8)"/>
      </g>

      <!-- 近地面草丛 + 石块（周期 200） -->
      <g id="groundRow">
        <path d="M14 515 q3 -16 7 0" fill="#4f8a52"/>
        <path d="M20 515 q4 -13 6 0" fill="#4f8a52"/>
        <path d="M58 515 q3 -14 6 0" fill="#5a9a5c"/>
        <path d="M96 515 q3 -18 8 0" fill="#4f8a52"/>
        <path d="M104 515 q3 -12 5 0" fill="#5a9a5c"/>
        <ellipse cx="150" cy="513" rx="9" ry="5" fill="#7a7b84"/>
        <path d="M172 515 q3 -15 7 0" fill="#4f8a52"/>
        <ellipse cx="186" cy="512" rx="6" ry="4" fill="#8a8b93"/>
      </g>

      <!-- 路面虚线（周期 200） -->
      <g id="dashRow">
        <rect x="0" y="624" width="104" height="11" rx="5" fill="#f2e6c8" opacity=".85"/>
      </g>

      <!-- 云 -->
      <g id="cloudA">
        <ellipse cx="0" cy="0" rx="46" ry="26" fill="#ffffff" opacity=".9"/>
        <ellipse cx="-30" cy="10" rx="30" ry="17" fill="#ffffff" opacity=".85"/>
        <ellipse cx="32" cy="12" rx="26" ry="15" fill="#ffffff" opacity=".85"/>
      </g>
    </defs>

    <!-- ============ 天空 / 太阳 ============ -->
    <rect x="0" y="0" width="1200" height="700" fill="url(#gSky)"/>
    <g id="sun">
      <circle cx="1055" cy="112" r="96" fill="url(#gSunGlow)"/>
      <g class="spin rays" stroke="#ffe9a8" stroke-width="7" stroke-linecap="round" opacity=".7">
        <line x1="1055" y1="42" x2="1055" y2="18"/><line x1="1055" y1="206" x2="1055" y2="182"/>
        <line x1="985" y1="112" x2="961" y2="112"/><line x1="1149" y1="112" x2="1125" y2="112"/>
        <line x1="1005" y1="62" x2="988" y2="45"/><line x1="1122" y1="179" x2="1105" y2="162"/>
        <line x1="1105" y1="62" x2="1122" y2="45"/><line x1="1005" y1="179" x2="988" y2="162"/>
      </g>
      <circle cx="1055" cy="112" r="44" fill="url(#gSunBody)"/>
    </g>

    <!-- ============ 云（最慢视差） ============ -->
    <g class="drift d1200">
      <use href="#cloudA" transform="translate(90 96) scale(1.05)"/>
      <use href="#cloudA" transform="translate(390 152) scale(.78)"/>
      <use href="#cloudA" transform="translate(700 74) scale(.9)"/>
      <use href="#cloudA" transform="translate(980 168) scale(.7)"/>
      <use href="#cloudA" transform="translate(1290 96) scale(1.05)"/>
      <use href="#cloudA" transform="translate(1590 152) scale(.78)"/>
      <use href="#cloudA" transform="translate(1900 74) scale(.9)"/>
      <use href="#cloudA" transform="translate(2180 168) scale(.7)"/>
    </g>

    <!-- 远处飞鸟 -->
    <g stroke="#5b6b7a" stroke-width="3" fill="none" stroke-linecap="round" opacity=".55">
      <path d="M300 210 q9 -9 18 0 q9 -9 18 0"/>
      <path d="M356 186 q7 -7 14 0 q7 -7 14 0"/>
      <path d="M250 250 q6 -6 12 0 q6 -6 12 0"/>
    </g>

    <!-- ============ 远山 ============ -->
    <g class="drift d600">
      <use href="#hillFarRow" x="-600"/><use href="#hillFarRow" x="0"/>
      <use href="#hillFarRow" x="600"/><use href="#hillFarRow" x="1200"/>
      <use href="#hillFarRow" x="1800"/>
    </g>

    <!-- ============ 近山 ============ -->
    <g class="drift d600f">
      <use href="#hillNearRow" x="-600"/><use href="#hillNearRow" x="0"/>
      <use href="#hillNearRow" x="600"/><use href="#hillNearRow" x="1200"/>
      <use href="#hillNearRow" x="1800"/>
    </g>

    <!-- ============ 树（中视差） ============ -->
    <g class="drift d600m">
      <use href="#treeRow" x="-600"/><use href="#treeRow" x="0"/>
      <use href="#treeRow" x="600"/><use href="#treeRow" x="1200"/>
      <use href="#treeRow" x="1800"/>
    </g>

    <!-- ============ 地面 ============ -->
    <rect x="0" y="500" width="1200" height="15" fill="url(#gGrass)"/>
    <rect x="0" y="515" width="1200" height="185" fill="url(#gRoad)"/>
    <rect x="0" y="515" width="1200" height="5" fill="#8b8c95" opacity=".8"/>

    <!-- 路缘碎石与草丛（最快视差，与轮子转速同速） -->
    <g class="drift d200">
      <use href="#groundRow" x="-400"/><use href="#groundRow" x="-200"/>
      <use href="#groundRow" x="0"/><use href="#groundRow" x="200"/>
      <use href="#groundRow" x="400"/><use href="#groundRow" x="600"/>
      <use href="#groundRow" x="800"/><use href="#groundRow" x="1000"/>
      <use href="#groundRow" x="1200"/><use href="#groundRow" x="1400"/>
      <use href="#groundRow" x="1600"/>
    </g>

    <!-- 路面中线 -->
    <g class="drift d200">
      <use href="#dashRow" x="-400"/><use href="#dashRow" x="-200"/>
      <use href="#dashRow" x="0"/><use href="#dashRow" x="200"/>
      <use href="#dashRow" x="400"/><use href="#dashRow" x="600"/>
      <use href="#dashRow" x="800"/><use href="#dashRow" x="1000"/>
      <use href="#dashRow" x="1200"/><use href="#dashRow" x="1400"/>
      <use href="#dashRow" x="1600"/>
    </g>

    <!-- 速度线 -->
    <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0">
      <line class="streak" x1="90"  y1="352" x2="250" y2="352" style="animation-delay:0s"/>
      <line class="streak" x1="140" y1="404" x2="330" y2="404" style="animation-delay:.4s"/>
      <line class="streak" x1="60"  y1="462" x2="200" y2="462" style="animation-delay:.8s"/>
      <line class="streak" x1="180" y1="300" x2="300" y2="300" style="animation-delay:1.2s"/>
      <line class="streak" x1="30"  y1="418" x2="150" y2="418" style="animation-delay:.2s"/>
    </g>

    <!-- 地面投影 -->
    <ellipse cx="600" cy="549" rx="235" ry="13" fill="#1b1c22" opacity=".22"/>

    <!-- ================= 自行车 ================= -->
    <!-- 车轮 -->
    <g class="wheel">
      <circle cx="420" cy="483" r="62" fill="none" stroke="#22242b" stroke-width="14"/>
      <circle cx="420" cy="483" r="62" fill="none" stroke="#3d4049" stroke-width="5" stroke-dasharray="7 13"/>
      <circle cx="420" cy="483" r="50" fill="none" stroke="#cdd2dc" stroke-width="3" opacity=".85"/>
      <g stroke="#b9bfcc" stroke-width="2.5" opacity=".9">
        <line x1="370" y1="483" x2="470" y2="483"/><line x1="420" y1="433" x2="420" y2="533"/>
        <line x1="384" y1="447" x2="456" y2="519"/><line x1="456" y1="447" x2="384" y2="519"/>
        <line x1="393" y1="456" x2="447" y2="510"/><line x1="447" y1="456" x2="393" y2="510"/>
      </g>
      <circle cx="420" cy="483" r="7" fill="#8b93a5"/>
    </g>
    <g class="wheel">
      <circle cx="800" cy="483" r="62" fill="none" stroke="#22242b" stroke-width="14"/>
      <circle cx="800" cy="483" r="62" fill="none" stroke="#3d4049" stroke-width="5" stroke-dasharray="7 13"/>
      <circle cx="800" cy="483" r="50" fill="none" stroke="#cdd2dc" stroke-width="3" opacity=".85"/>
      <g stroke="#b9bfcc" stroke-width="2.5" opacity=".9">
        <line x1="750" y1="483" x2="850" y2="483"/><line x1="800" y1="433" x2="800" y2="533"/>
        <line x1="764" y1="447" x2="836" y2="519"/><line x1="836" y1="447" x2="764" y2="519"/>
        <line x1="773" y1="456" x2="827" y2="510"/><line x1="827" y1="456" x2="773" y2="510"/>
      </g>
      <circle cx="800" cy="483" r="7" fill="#8b93a5"/>
    </g>

    <!-- 车架（描边+主体） -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#0a6159" stroke-width="15">
        <path d="M610 483 L420 483"/><path d="M560 388 L420 483"/>
        <path d="M610 483 L560 388"/><path d="M610 483 L752 438"/>
        <path d="M560 388 L760 392"/><path d="M760 392 L752 438"/>
        <path d="M752 438 L800 483"/>
      </g>
      <g stroke="#14a396" stroke-width="9">
        <path d="M610 483 L420 483"/><path d="M560 388 L420 483"/>
        <path d="M610 483 L560 388"/><path d="M610 483 L752 438"/>
        <path d="M560 388 L760 392"/><path d="M760 392 L752 438"/>
        <path d="M752 438 L800 483"/>
      </g>
      <path d="M752 438 L800 483" stroke="#0f8478" stroke-width="4" opacity=".7"/>
    </g>

    <!-- 链条 -->
    <g stroke="#767c8a" stroke-width="3" stroke-dasharray="5 4" fill="none" opacity=".9">
      <path d="M604 464 L424 476"/><path d="M616 501 L416 490"/>
    </g>

    <!-- 车座与车把 -->
    <g>
      <path d="M560 366 L560 392" stroke="#9aa3b5" stroke-width="8" stroke-linecap="round"/>
      <path d="M530 364 q3 -14 24 -14 h14 q18 0 20 12 l2 8 h-62 z" fill="#2f3340"/>
      <path d="M760 392 L764 356" stroke="#9aa3b5" stroke-width="9" stroke-linecap="round" fill="none"/>
      <path d="M740 346 Q764 334 796 346" stroke="#39404f" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M780 342 L798 348" stroke="#232833" stroke-width="15" stroke-linecap="round"/>
    </g>

    <!-- 牙盘与曲柄（JS 旋转） -->
    <g id="crank">
      <circle cx="610" cy="483" r="21" fill="none" stroke="#c9ced9" stroke-width="4"/>
      <circle cx="610" cy="483" r="21" fill="none" stroke="#c9ced9" stroke-width="4" stroke-dasharray="4 9"/>
      <g id="crankArm">
        <line x1="610" y1="483" x2="644" y2="483" stroke="#7e8698" stroke-width="9" stroke-linecap="round"/>
        <line x1="610" y1="483" x2="576" y2="483" stroke="#7e8698" stroke-width="9" stroke-linecap="round"/>
        <g id="pedalA" transform="translate(644 483)">
          <rect x="-13" y="-5" width="26" height="10" rx="4" fill="#333846"/>
        </g>
        <g id="pedalB" transform="translate(576 483)">
          <rect x="-13" y="-5" width="26" height="10" rx="4" fill="#333846"/>
        </g>
      </g>
    </g>

    <!-- ================= 鹈鹕 ================= -->
    <!-- 后腿（远侧，画在身体之下） -->
    <g id="legBack">
      <path id="legBackLine" d="" fill="none" stroke="#a86a2b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="legBackIn" d="" fill="none" stroke="#d9984f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <g id="footBack" transform="translate(576 479)" stroke="#b8742e" stroke-width="5" stroke-linecap="round" fill="none">
        <path d="M0 0 q9 5 15 5"/><path d="M0 0 q10 1 16 0"/><path d="M0 0 q8 -3 12 -7"/>
      </g>
    </g>

    <!-- 前腿（近侧） -->
    <g id="legFront">
      <path id="legFrontLine" d="" fill="none" stroke="#a86a2b" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="legFrontIn" d="" fill="none" stroke="#f0b364" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <g id="footFront" transform="translate(644 479)" stroke="#c8802f" stroke-width="5" stroke-linecap="round" fill="none">
        <path d="M0 0 q9 5 15 5"/><path d="M0 0 q10 1 16 0"/><path d="M0 0 q8 -3 12 -7"/>
      </g>
    </g>

    <!-- 上半身（脖子 + 头 + 喙 + 头盔 + 眼） -->
    <g id="pelicanUpper">
      <!-- 脖子 -->
      <path d="M592 300 C588 250 604 200 630 174" fill="none" stroke="#ddd4c0" stroke-width="36" stroke-linecap="round"/>
      <path d="M592 300 C588 250 604 200 630 174" fill="none" stroke="#f9f5ea" stroke-width="30" stroke-linecap="round"/>
      <!-- 头 -->
      <ellipse cx="660" cy="158" rx="46" ry="41" fill="#f9f5ea" stroke="#ddd4c0" stroke-width="3"/>
      <!-- 喉囊 -->
      <path d="M702 166 C742 173 792 171 822 164 C818 204 792 231 752 231 C718 229 704 202 702 166 Z"
            fill="#f6c273" stroke="#d8862a" stroke-width="3" stroke-linejoin="round"/>
      <!-- 上喙 -->
      <path d="M698 139 C742 137 790 147 820 157 Q830 160 826 167 C820 175 792 175 762 173 L698 170 Z"
            fill="#f2a63a" stroke="#d8862a" stroke-width="3" stroke-linejoin="round"/>
      <path d="M700 166 C740 170 790 168 822 163" fill="none" stroke="#c8761f" stroke-width="2.5"/>
      <!-- 眼睛 -->
      <g id="eyeGroup" transform="translate(684 163)">
        <ellipse cx="0" cy="0" rx="11" ry="12" fill="#ffffff"/>
        <circle cx="3" cy="2" r="6" fill="#26262d"/>
        <circle cx="5" cy="-1" r="2.2" fill="#ffffff"/>
        <path d="M-13 -13 q14 -8 25 1" fill="none" stroke="#e3dac6" stroke-width="3" stroke-linecap="round"/>
      </g>
      <!-- 头盔 -->
      <path d="M615 146 C613 106 638 80 668 80 C698 80 721 106 719 142 L717 149 L614 152 Z"
            fill="#e2453c" stroke="#b9352e" stroke-width="3" stroke-linejoin="round"/>
      <path d="M614 146 L724 140 L726 151 L614 159 Z" fill="#c2352f" stroke="#b9352e" stroke-width="2" stroke-linejoin="round"/>
      <path d="M638 150 L654 192 M702 146 L690 188" fill="none" stroke="#b9352e" stroke-width="3" stroke-linecap="round"/>
      <g fill="#a82c26" opacity=".8">
        <ellipse cx="645" cy="112" rx="7" ry="4"/><ellipse cx="665" cy="106" rx="7" ry="4"/><ellipse cx="686" cy="112" rx="7" ry="4"/>
      </g>
      <!-- 头盔小旗 -->
      <line x1="668" y1="80" x2="668" y2="42" stroke="#7c828f" stroke-width="3"/>
      <g class="flag">
        <path d="M668 44 L712 54 L668 66 Z" fill="#ffcf3f" stroke="#e0a71f" stroke-width="2" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- 身体 -->
    <g id="pelicanBody">
      <ellipse cx="560" cy="300" rx="76" ry="58" fill="#f9f5ea" stroke="#ddd4c0" stroke-width="3"/>
      <ellipse cx="566" cy="322" rx="62" ry="34" fill="#efe8d8" opacity=".75"/>
      <!-- 尾羽 -->
      <g fill="#e4dac4" stroke="#d3cab5" stroke-width="2" stroke-linejoin="round">
        <path d="M496 280 q-28 -6 -46 -26 q28 2 48 14 z"/>
        <path d="M492 296 q-32 2 -52 10 q28 -4 52 -2 z"/>
        <path d="M498 270 q-24 -12 -34 -32 q24 6 38 22 z"/>
      </g>
      <!-- 折叠的翅膀 -->
      <path d="M506 268 C478 292 482 336 518 352 C546 342 556 300 536 274 Z"
            fill="#eae3d2" stroke="#d3cab5" stroke-width="3" stroke-linejoin="round"/>
      <path d="M512 286 q22 12 34 30" fill="none" stroke="#d3cab5" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- 伸向车把的翅膀（每帧重绘，始终握住把手） -->
    <g id="reachWing">
      <path id="reachWingOut" d="" fill="none" stroke="#c6bda8" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="reachWingIn" d="" fill="none" stroke="#ece5d3" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
      <g stroke="#ece5d3" stroke-width="7" stroke-linecap="round" fill="none">
        <path d="M782 336 q12 -1 18 -4"/>
        <path d="M786 344 q12 0 18 -2"/>
        <path d="M782 352 q11 2 17 4"/>
      </g>
    </g>

    <!-- 扬尘 -->
    <g id="dust"></g>
  </svg>

  <div class="hud">
    <b>PELICAN EXPRESS</b>
    <span>鹈鹕骑行 · 纯 SVG 2D 动画</span>
  </div>
</div>

<script>
(function () {
  'use strict';

  var C = { x: 610, y: 483, r: 34 };   // 曲柄中心与曲柄半径
  var L1 = 104, L2 = 98;               // 大腿 / 小腿长度
  var BODY = { x: 560, y: 300 };       // 身体中心（用于身体旋转）
  var GRIP = { x: 790, y: 344 };       // 车把握把点

  var el = {
    crankArm: document.getElementById('crankArm'),
    pedalA: document.getElementById('pedalA'),
    pedalB: document.getElementById('pedalB'),
    body: document.getElementById('pelicanBody'),
    upper: document.getElementById('pelicanUpper'),
    eye: document.getElementById('eyeGroup'),
    legBackLine: document.getElementById('legBackLine'),
    legBackIn: document.getElementById('legBackIn'),
    legFrontLine: document.getElementById('legFrontLine'),
    legFrontIn: document.getElementById('legFrontIn'),
    footBack: document.getElementById('footBack'),
    footFront: document.getElementById('footFront'),
    wingOut: document.getElementById('reachWingOut'),
    wingIn: document.getElementById('reachWingIn'),
    dust: document.getElementById('dust')
  };

  var SVGNS = 'http://www.w3.org/2000/svg';

  /* ---------- 工具函数 ---------- */
  function bodyPoint(px, py, bob, rotDeg) {
    var r = rotDeg * Math.PI / 180;
    var dx = px - BODY.x, dy = py - BODY.y;
    var rx = dx * Math.cos(r) - dy * Math.sin(r);
    var ry = dx * Math.sin(r) + dy * Math.cos(r);
    return { x: BODY.x + rx, y: BODY.y + ry + bob };
  }

  // 两骨 IK：髋 -> 膝 -> 脚，膝盖朝前
  function solveLeg(hip, foot) {
    var dx = foot.x - hip.x, dy = foot.y - hip.y;
    var d = Math.hypot(dx, dy);
    var maxd = L1 + L2 - 1;
    if (d > maxd) { var s = maxd / d; foot = { x: hip.x + dx * s, y: hip.y + dy * s }; d = maxd; }
    if (d < 1) { d = 1; }
    var a = (L1 * L1 - L2 * L2 + d * d) / (2 * d * d);
    var hh = Math.sqrt(Math.max(0, L1 * L1 - L1 * L1 * a * a));
    var mx = hip.x + a * dx, my = hip.y + a * dy;
    return {
      knee: { x: mx + (dy / d) * hh, y: my - (dx / d) * hh },
      foot: foot
    };
  }

  function setLeg(lineOut, lineIn, footEl, hip, foot, toeAngle) {
    var s = solveLeg(hip, foot);
    var d = 'M' + hip.x.toFixed(1) + ' ' + hip.y.toFixed(1) +
            ' L' + s.knee.x.toFixed(1) + ' ' + s.knee.y.toFixed(1) +
            ' L' + s.foot.x.toFixed(1) + ' ' + s.foot.y.toFixed(1);
    lineOut.setAttribute('d', d);
    lineIn.setAttribute('d', d);
    footEl.setAttribute('transform',
      'translate(' + s.foot.x.toFixed(1) + ' ' + (s.foot.y - 4).toFixed(1) + ') rotate(' + toeAngle.toFixed(1) + ')');
  }

  /* ---------- 扬尘 ---------- */
  var puffs = [];
  var puffTimer = 0;
  function spawnDust() {
    var c = document.createElementNS(SVGNS, 'circle');
    c.setAttribute('cx', 418 + (Math.random() * 26 - 13));
    c.setAttribute('cy', 542);
    c.setAttribute('r', 4);
    c.setAttribute('fill', '#e8e2d4');
    c.setAttribute('opacity', 0.65);
    el.dust.appendChild(c);
    puffs.push({ el: c, life: 0, x: parseFloat(c.getAttribute('cx')), y: 542 });
  }
  function updateDust(dt) {
    for (var i = puffs.length - 1; i >= 0; i--) {
      var p = puffs[i];
      p.life += dt;
      var t = p.life / 0.85;
      if (t >= 1) { p.el.remove(); puffs.splice(i, 1); continue; }
      p.x -= 120 * dt;
      p.y -= 26 * dt;
      p.el.setAttribute('cx', p.x.toFixed(1));
      p.el.setAttribute('cy', p.y.toFixed(1));
      p.el.setAttribute('r', (4 + t * 20).toFixed(1));
      p.el.setAttribute('opacity', (0.65 * (1 - t)).toFixed(3));
    }
  }

  /* ---------- 主循环 ---------- */
  var ang = 0;
  var last = performance.now();
  var blinkTimer = 2.4;
  var blinkT = -1;

  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    ang += dt * 4.0;                 // 与车轮转速一致（约 0.64 转/秒）
    var deg = ang * 180 / Math.PI;

    // 曲柄与脚踏
    el.crankArm.setAttribute('transform', 'rotate(' + deg.toFixed(2) + ' ' + C.x + ' ' + C.y + ')');
    el.pedalA.setAttribute('transform', 'translate(' + (C.x + C.r) + ' ' + C.y + ') rotate(' + (-deg).toFixed(2) + ')');
    el.pedalB.setAttribute('transform', 'translate(' + (C.x - C.r) + ' ' + C.y + ') rotate(' + (-deg).toFixed(2) + ')');

    // 身体起伏（每转一圈上下两次）与轻微摆动
    var bob = -5 + 5 * Math.sin(2 * ang);
    var rot = 1.1 * Math.sin(2 * ang + 0.6);
    el.body.setAttribute('transform',
      'translate(0 ' + bob.toFixed(2) + ') rotate(' + rot.toFixed(2) + ' ' + BODY.x + ' ' + BODY.y + ')');

    // 头部延迟点头
    var hbob = -9 + 7 * Math.sin(2 * ang + 0.9);
    var hrot = 1.6 * Math.sin(2 * ang + 1.2);
    el.upper.setAttribute('transform',
      'translate(0 ' + hbob.toFixed(2) + ') rotate(' + hrot.toFixed(2) + ' 655 200)');

    // 腿
    var hipB = bodyPoint(548, 332, bob, rot);
    var hipF = bodyPoint(566, 328, bob, rot);
    var footA = { x: C.x + C.r * Math.cos(ang), y: C.y + C.r * Math.sin(ang) - 4 };
    var footB = { x: C.x + C.r * Math.cos(ang + Math.PI), y: C.y + C.r * Math.sin(ang + Math.PI) - 4 };
    setLeg(el.legBackLine, el.legBackIn, el.footBack, hipB, footB, 8);
    setLeg(el.legFrontLine, el.legFrontIn, el.footFront, hipF, footA, 8);

    // 伸向车把的翅膀：肩点跟随身体，末端始终握住把手
    var sh = bodyPoint(596, 264, bob, rot);
    var tx = GRIP.x, ty = GRIP.y;
    var ex = sh.x + 0.52 * (tx - sh.x);
    var ey = sh.y + 0.55 * (ty - sh.y) + 30;
    var wingD = 'M' + sh.x.toFixed(1) + ' ' + sh.y.toFixed(1) +
                ' Q' + ex.toFixed(1) + ' ' + ey.toFixed(1) + ' ' + tx.toFixed(1) + ' ' + ty.toFixed(1);
    el.wingOut.setAttribute('d', wingD);
    el.wingIn.setAttribute('d', wingD);

    // 眨眼
    if (blinkT >= 0) {
      blinkT += dt;
      var s = blinkT < 0.07 ? 0.15 : (blinkT < 0.13 ? 0.15 + (blinkT - 0.07) / 0.06 * 0.85 : 1);
      el.eye.setAttribute('transform', 'translate(684 163) scale(1 ' + s.toFixed(3) + ')');
      if (blinkT > 0.15) { blinkT = -1; el.eye.setAttribute('transform', 'translate(684 163)'); }
    } else {
      blinkTimer -= dt;
      if (blinkTimer <= 0) { blinkT = 0; blinkTimer = 2.2 + Math.random() * 2.6; }
    }

    // 扬尘
    puffTimer -= dt;
    if (puffTimer <= 0) { spawnDust(); puffTimer = 0.07; }
    updateDust(dt);

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
