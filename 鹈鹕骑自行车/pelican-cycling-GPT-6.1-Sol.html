<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕的海岸骑行</title>
<style>
:root{--ink:#204e59;--sky:#bce9ed;--coral:#ff765e}*{box-sizing:border-box}body{margin:0;background:#d8f2f1;color:var(--ink);font-family:'Microsoft YaHei',sans-serif;min-height:100vh;display:grid;place-items:center;padding:28px}main{width:min(1100px,100%)}header{display:flex;justify-content:space-between;align-items:end;padding:0 8px 22px;gap:20px}h1{font-size:clamp(26px,4vw,44px);letter-spacing:-2px;margin:0;font-weight:900}header p{margin:10px 0 0;font-size:14px;letter-spacing:2px}.stamp{font-size:32px} .scene{border-radius:32px;overflow:hidden;box-shadow:0 18px 0 #a5d5d5;position:relative;background:var(--sky)}svg{display:block;width:100%;height:auto}footer{display:flex;justify-content:space-between;align-items:center;padding:32px 8px 0;gap:16px;font-size:13px}button{border:2px solid var(--ink);border-radius:40px;background:transparent;color:var(--ink);padding:10px 22px;font:inherit;cursor:pointer}button:hover{background:var(--ink);color:white}button:focus-visible{outline:3px solid var(--coral);outline-offset:4px}.spin{animation:spin 1.4s linear infinite;transform-box:fill-box;transform-origin:center}.bob{animation:bob 1.4s ease-in-out infinite}.wing{animation:wing 1.4s ease-in-out infinite;transform-origin:506px 304px}.scarf{animation:scarf .7s ease-in-out infinite alternate;transform-origin:570px 239px}.clouds{animation:drift 32s linear infinite}.ground{animation:road 2.8s linear infinite}.plants{animation:road 7s linear infinite}.paused *{animation-play-state:paused!important}@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{0%,100%{transform:translateY(0) rotate(-.4deg)}50%{transform:translateY(5px) rotate(.4deg)}}@keyframes wing{50%{transform:rotate(-3deg)}}@keyframes scarf{to{transform:skewY(8deg)}}@keyframes drift{to{transform:translateX(-400px)}}@keyframes road{to{transform:translateX(-550px)}}@media(max-width:600px){body{padding:16px}header{padding-top:14px}.stamp{display:none}footer{font-size:11px}.scene{border-radius:20px}} 
</style>
</head>
<body>
<main>
<header><div><h1>今天，顺风。</h1><p>一只鹈鹕的海岸骑行日记</p></div><span class="stamp" aria-hidden="true">☀</span></header>
<div class="scene" id="scene">
<svg viewBox="0 0 1100 650" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
<title id="title">鹈鹕骑着珊瑚红自行车，在海边悠闲前进</title><desc id="desc">车轮不断旋转，鹈鹕的双腿踩动踏板，红围巾随风飘动，云朵和路旁植物向后移动。</desc>
<defs>
 <pattern id="water" width="150" height="40" patternUnits="userSpaceOnUse"><path d="M20 22h44m35 10h24" stroke="#a3dcdb" stroke-width="3" stroke-linecap="round"/></pattern>
 <g id="cloud" fill="#effcfa"><path d="M0 29c0-15 17-22 28-14C34-10 73-7 79 16c19-8 36 3 36 17H0Z"/></g>
 <g id="wheel"><circle r="86" fill="#f6fbeb" stroke="#234f5b" stroke-width="10"/><circle r="73" fill="#cce5dc" stroke="#fff9df" stroke-width="3"/><g stroke="#faf8e7" stroke-width="2"><path d="M-73 0H73M0-73V73M-52-52 52 52M-52 52 52-52M-28-67 28 67M-67-28 67 28M-67 28 67-28M-28 67 28-67"/></g><circle r="10" fill="#234f5b"/></g>
 <g id="plant" fill="none" stroke="#368b80" stroke-width="5" stroke-linecap="round"><path d="M0 0q-3-27-19-38M0 0q0-40 12-57M0 0q10-20 27-27"/></g>
</defs>
<path fill="#bce9ed" d="M0 0h1100v650H0z"/>
<circle cx="882" cy="112" r="53" fill="#fff1a2"/><circle cx="882" cy="112" r="69" fill="none" stroke="#d0eddb" stroke-width="2"/>
<g class="clouds"><use href="#cloud" x="90" y="90"/><use href="#cloud" x="440" y="135" transform="scale(.8)"/><use href="#cloud" x="1000" y="60"/><use href="#cloud" x="1370" y="110"/></g>
<path d="M0 320q130-80 250-26t230 5q160-96 330-35t290 14v160H0Z" fill="#80c6c2"/>
<path d="M0 345q180-45 390-15t365-8q200-36 345-5v160H0Z" fill="#69bec5"/>
<path d="M0 350h1100v135H0z" fill="url(#water)"/>
<path d="M0 427q300-35 570 0t530-10v233H0Z" fill="#f7e9bb"/>
<path d="M0 488q400-20 1100 0v115H0Z" fill="#f0dca7"/>
<path d="M0 594h1100" stroke="#dfc991" stroke-width="3"/>
<g class="ground" stroke="#fff8dd" stroke-width="5" stroke-linecap="round"><path d="M-80 555H30m130 0h110m165 0h110m165 0h110m165 0h110m165 0h110m165 0h110"/></g>
<g class="plants"><use href="#plant" x="70" y="472"/><use href="#plant" x="900" y="467"/><use href="#plant" x="1330" y="472"/><path d="m242 616 16-12 17 12m880 0 16-12 17 12" fill="none" stroke="#c9b67e" stroke-width="4"/></g>
<ellipse cx="544" cy="534" rx="255" ry="17" fill="#b8ab7b" opacity=".23"/>
<!-- 自行车与骑手共用同一周期；双腿由脚本按踏板位置绘制。 -->
<g stroke-linecap="round" stroke-linejoin="round">
 <g transform="translate(365 439)"><g class="spin"><use href="#wheel"/></g></g>
 <g transform="translate(730 439)"><g class="spin"><use href="#wheel"/></g></g>
 <path id="farLeg" d="M502 338 550 370 592 439" fill="none" stroke="#d6a346" stroke-width="15"/>
 <path d="m365 439 101-145 84 145H365l127-103 58 103 140-147 40 147m-238-103-26-42m224-2-17-49q-3-11 12-11h30" fill="none" stroke="#ff765e" stroke-width="10"/>
 <path d="m365 439 101-145m84 145 140-147" fill="none" stroke="#ffab86" stroke-width="3"/>
 <path d="M466 294v-22m-31 0h60" fill="none" stroke="#234f5b" stroke-width="10"/>
 <path d="M690 244h26" stroke="#234f5b" stroke-width="10"/>
 <path d="M365 439 550 439" stroke="#315b61" stroke-width="3"/>
 <circle cx="550" cy="439" r="24" fill="#fff2cd" stroke="#234f5b" stroke-width="5"/>
 <g class="bob">
  <path d="m450 300-44-27 15 45 40 8" fill="#d2e1d7" stroke="#234f5b" stroke-width="4"/>
  <path d="M444 288c-14-52 31-98 86-80l30 7c-7-55-4-111 35-120 32-8 58 14 55 43-1 29-35 49-42 74-8 28 13 56-4 90-21 43-135 53-160-14Z" fill="#fffbee" stroke="#234f5b" stroke-width="4"/>
  <path d="M599 171c-20 40-3 67-25 84" fill="none" stroke="#dce5d9" stroke-width="13"/>
  <path d="M624 136c49-9 96 0 150 20-31 7-85 18-144 8Z" fill="#ffc653" stroke="#234f5b" stroke-width="4"/>
  <path d="M630 164q64 78 144-8Z" fill="#f1ad51" stroke="#234f5b" stroke-width="4"/>
  <path d="M645 172q42 32 88-3" fill="none" stroke="#ffd88b" stroke-width="4"/>
  <circle cx="619" cy="125" r="6" fill="#234f5b"/><circle cx="621" cy="123" r="1.8" fill="white"/>
  <path d="m582 98 1-13 10 9 7-15 6 14" fill="#fffbee" stroke="#234f5b" stroke-width="3"/>
  <g class="scarf"><path d="M575 228q-52-1-97-24l13 24-21 9q67 19 108 5" fill="#ff765e" stroke="#234f5b" stroke-width="3"/></g>
  <path d="m563 222 29 12-7 16-28-13Z" fill="#ff765e" stroke="#234f5b" stroke-width="3"/>
  <path class="wing" d="M480 251c-25 4-28 42 1 54 30 13 64-9 88-25l99-29q12-4 19-1" fill="#e2e9db" stroke="#234f5b" stroke-width="4"/>
  <path d="m480 280 35 5m-31 7 25 2" fill="none" stroke="#b5ccbf" stroke-width="3"/>
 </g>
 <path id="nearLeg" d="M508 329 490 390 508 439" fill="none" stroke="#f1b94f" stroke-width="16"/>
 <path id="crank" d="M508 439H592" fill="none" stroke="#234f5b" stroke-width="5"/>
 <path id="nearFoot" d="M493 439h30" stroke="#234f5b" stroke-width="8"/>
 <path id="farFoot" d="M577 439h30" stroke="#234f5b" stroke-width="8"/>
</g>
<g fill="none" stroke="#fffbee" stroke-width="4" stroke-linecap="round"><path d="M310 243h-48m58 22h-27m18 25h-62"/></g>
<g fill="none" stroke="#4a929b" stroke-width="3" stroke-linecap="round"><path d="M809 209q8-10 16 0 8-10 16 0m-641-8q6-8 12 0 6-8 12 0"/></g>
</svg>
</div>
<footer><span>海风刚好，慢慢骑就好。</span><button id="toggle" type="button" aria-pressed="false">暂停一下</button></footer>
</main>
<script>
const scene=document.getElementById('scene'),button=document.getElementById('toggle');
let paused=false,time=0,last=0;
button.addEventListener('click',()=>{paused=!paused;scene.classList.toggle('paused',paused);button.textContent=paused?'继续兜风':'暂停一下';button.setAttribute('aria-pressed',String(paused));});
const nearLeg=document.getElementById('nearLeg'),farLeg=document.getElementById('farLeg'),nearFoot=document.getElementById('nearFoot'),farFoot=document.getElementById('farFoot'),crank=document.getElementById('crank');
function draw(now){if(last&&!paused)time+=Math.min(now-last,80);last=now;const a=time/1400*Math.PI*2,x=550+42*Math.cos(a),y=439+42*Math.sin(a),bx=1100-x,by=878-y;nearLeg.setAttribute('d',`M508 329 Q${x-54} ${y-43} ${x} ${y}`);farLeg.setAttribute('d',`M502 330 Q${bx+35} ${by-65} ${bx} ${by}`);nearFoot.setAttribute('d',`M${x-12} ${y}h29`);farFoot.setAttribute('d',`M${bx-12} ${by}h29`);crank.setAttribute('d',`M${x} ${y}L550 439 ${bx} ${by}`);requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script>
</body>
</html>
