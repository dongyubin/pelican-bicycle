<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑车 · Pelican on a Bicycle</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(1200px 700px at 50% 18%,#22303f,#111820)}
  svg{width:min(960px,96vw);height:auto;display:block;border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
  .bob{animation:bob .55s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .clouds{animation:slide 26s linear infinite}
  .trees{animation:slide 6.5s linear infinite}
  @keyframes slide{to{transform:translateX(-960px)}}
  .road{animation:roadmove .55s linear infinite}
  @keyframes roadmove{to{stroke-dashoffset:160}}
  .chain-t{animation:chaint .32s linear infinite}
  @keyframes chaint{to{stroke-dashoffset:-18}}
  .chain-b{animation:chainb .32s linear infinite}
  @keyframes chainb{to{stroke-dashoffset:18}}
  .zoom{animation:zoom .5s linear infinite}
  @keyframes zoom{to{stroke-dashoffset:60}}
  .bird{animation:fly 13s linear infinite}
  @keyframes fly{from{transform:translate(1010px,110px)}to{transform:translate(-80px,70px)}}
</style>
