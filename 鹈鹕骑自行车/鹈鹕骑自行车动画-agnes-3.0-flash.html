<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹈鹕骑自行车动画</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            margin: 0 0 10px 0;
            color: #333;
            font-size: 24px;
        }

        p {
            margin: 0;
            color: #666;
            font-size: 14px;
        }

        svg {
            width: 600px;
            max-width: 90%;
            height: 400px;
        }

        /* 背景移动效果 */
        @keyframes moveBackground {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100px); }
        }

        /* 轮子旋转 */
        @keyframes rotateWheel {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 身体轻微上下浮动 */
        @keyframes floatBody {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-2px); }
        }

        /* 腿部的踩踏动作 (简化为旋转动画) */
        @keyframes pedalLeg {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(30deg); }
            100% { transform: rotate(0deg); }
        }

    </style>
</head>
<body>

<div class="container">
    <h1>🚴 鹈鹕骑手</h1>
    <p>纯 SVG + CSS 动画，无需 JS</p>

    <svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
        <!-- 定义组 -->
        <defs>
            <!-- 背景云朵样式 -->
            <g id="clouds">
                <ellipse cx="50" cy="80" rx="40" ry="20" fill="#fff" opacity="0.7"/>
                <ellipse cx="80" cy="70" rx="30" ry="15" fill="#fff" opacity="0.7"/>
                <ellipse cx="200" cy="50" rx="50" ry="25" fill="#fff" opacity="0.6"/>
                <ellipse cx="400" cy="90" rx="60" ry="30" fill="#fff" opacity="0.5"/>
            </g>

            <!-- 树 -->
            <g id="tree">
                <rect x="480" y="250" width="10" height="80" fill="#5D4037"/>
                <circle cx="485" cy="230" r="40" fill="#4CAF50"/>
                <circle cx="460" cy="250" r="30" fill="#4CAF50"/>
                <circle cx="510" cy="250" r="30" fill="#4CAF50"/>
            </g>
        </defs>

        <!-- 1. 背景层 (移动的云和树) -->
        <g style="animation: moveBackground 10s linear infinite;">
            <!-- 为了让循环平滑，云和树重复排列 -->
            <use href="#clouds" x="0" y="0"/>
            <use href="#tree" x="0" y="0"/>
            <use href="#clouds" x="600" y="0"/>
            <use href="#tree" x="600" y="0"/>
        </g>

        <!-- 2. 地面 -->
        <rect x="0" y="330" width="600" height="70" fill="#E0E0E0"/>
        <line x1="0" y1="330" x2="600" y2="330" stroke="#333" stroke-width="4"/>
        <!-- 地面纹理线 -->
        <g stroke="#BBB" stroke-width="2" stroke-dasharray="20 10" style="animation: moveBackground 2s linear infinite;">
            <line x1="0" y1="360" x2="600" y2="360"/>
            <line x1="0" y1="380" x2="600" y2="380"/>
        </g>

        <!-- 3. 自行车主体 (静止在原地，背景在动，制造相对运动感) -->
        <g id="bicycle" transform="translate(150, 200)">
            <!-- 车架 -->
            <path d="M 80 80 L 160 80 L 200 30 L 80 30 Z" stroke="#E53935" stroke-width="8" fill="none" stroke-linejoin="round"/>
            <!-- 后轮 -->
            <g style="transform-origin: 80px 80px; animation: rotateWheel 2s linear infinite;">
                <circle cx="80" cy="80" r="40" stroke="#333" stroke-width="6" fill="none"/>
                <line x1="80" y1="40" x2="80" y2="120" stroke="#666" stroke-width="2"/>
                <line x1="40" y1="80" x2="120" y2="80" stroke="#666" stroke-width="2"/>
                <circle cx="80" cy="80" r="4" fill="#333"/>
            </g>
            <!-- 前轮 -->
            <g style="transform-origin: 200px 80px; animation: rotateWheel 2s linear infinite;">
                <circle cx="200" cy="80" r="40" stroke="#333" stroke-width="6" fill="none"/>
                <line x1="200" y1="40" x2="200" y2="120" stroke="#666" stroke-width="2"/>
                <line x1="160" y1="80" x2="240" y2="80" stroke="#666" stroke-width="2"/>
                <circle cx="200" cy="80" r="4" fill="#333"/>
            </g>
            
            <!-- 踏板轴心 -->
            <circle cx="140" cy="80" r="8" fill="#555"/>
            
            <!-- 踏板 -->
            <g id="pedals" style="transform-origin: 140px 80px; animation: rotateWheel 1s linear infinite;">
                <line x1="120" y1="80" x2="160" y2="80" stroke="#333" stroke-width="4"/>
                <rect x="110" y="75" width="20" height="10" fill="#222" rx="2"/>
                <rect x="150" y="75" width="20" height="10" fill="#222" rx="2"/>
            </g>

            <!-- 车座 -->
            <path d="M 70 20 L 90 20 L 80 35 Z" fill="#222"/>
            <rect x="75" y="20" width="10" height="15" fill="#444"/>

            <!-- 车把 -->
            <path d="M 200 20 L 200 40 M 185 20 L 200 20 L 215 20" stroke="#666" stroke-width="4" fill="none" stroke-linecap="round"/>
            
            <!-- 车篮 (可选) -->
            <path d="M 220 40 L 250 40 L 245 60 L 225 60 Z" stroke="#8D6E63" stroke-width="2" fill="#D7CCC8" opacity="0.8"/>
        </g>

        <!-- 4. 鹈鹕 (位于车座上，身体随踏板轻微浮动) -->
        <g id="pelican" style="animation: floatBody 1s ease-in-out infinite;">
            
            <!-- 鹈鹕的腿 (连接到踏板) -->
            <!-- 后脚 -->
            <path d="M 100 330 Q 110 310 120 330" stroke="#FF9800" stroke-width="5" fill="none" stroke-linecap="round"/>
            <!-- 前脚 (稍微弯曲以显示踩踏) -->
            <path d="M 160 330 Q 150 310 140 330" stroke="#FF9800" stroke-width="5" fill="none" stroke-linecap="round"/>

            <!-- 鹈鹕的身体 -->
            <g transform="translate(150, 200)">
                <!-- 尾巴 -->
                <path d="M -20 20 L -50 10 L -40 30 Z" fill="#ECEFF1"/>
                
                <!-- 身体主体 -->
                <ellipse cx="0" cy="20" rx="35" ry="25" fill="#ECEFF1" stroke="#B0BEC5" stroke-width="1"/>
                
                <!-- 翅膀 -->
                <path d="M -10 10 Q 10 0 20 15 Q 10 25 -10 15 Z" fill="#CFD8DC"/>
                
                <!-- 头颈 -->
                <path d="M 20 10 Q 40 0 45 -20" stroke="#ECEFF1" stroke-width="10" fill="none" stroke-linecap="round"/>
                
                <!-- 头部 -->
                <circle cx="45" cy="-20" r="12" fill="#ECEFF1"/>
                
                <!-- 眼睛 -->
                <circle cx="48" cy="-22" r="2" fill="#222"/>
                
                <!-- 大喙 (鹈鹕特征) -->
                <path d="M 55 -25 L 80 -15 L 55 -10 Q 50 -15 55 -25 Z" fill="#FFA726"/>
                <!-- 喙下的喉囊 -->
                <path d="M 55 -10 Q 65 5 75 -5 L 80 -15" fill="#FF8F00" opacity="0.8"/>
                
                <!-- 红色冠羽 -->
                <path d="M 40 -30 Q 35 -40 45 -35" stroke="#E53935" stroke-width="2" fill="none"/>
            </g>
        </g>
        
    </svg>
</div>

<script>
    // 虽然主要使用CSS，但为了确保兼容性和可能的细微调整，
    // 这里不提供额外JS，保持纯HTML/CSS/SVG的纯净性。
    // 如果需要在不同浏览器中完美兼容 transform-origin，CSS已足够。
</script>

</body>
</html>
