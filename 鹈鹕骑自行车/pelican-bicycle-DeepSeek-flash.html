<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>鹈鹕骑自行车 · 2D SVG 动画</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: radial-gradient(130% 100% at 50% 0%, #eefaff 0%, #d3e9f3 50%, #b9d6e3 100%);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .stage {
    width: min(96vw, 1180px, 150vh);
    aspect-ratio: 900 / 560;
    border-radius: 30px;
    overflow: hidden;
    background: #d9eef7;
    box-shadow:
      0 40px 90px -32px rgba(18, 62, 82, .55),
      0 0 0 1px rgba(255, 255, 255, .55) inset;
  }
  svg { display: block; width: 100%; height: 100%; }

  .cloud { animation: drift 30s ease-in-out infinite alternate; }
  .cloud.b { animation-duration: 38s; animation-delay: -11s; }
  .cloud.c { animation-duration: 46s; animation-delay: -23s; }
  @keyframes drift {
    from { transform: translateX(-26px); }
    to   { transform: translateX(30px); }
  }

  .rider-bob { animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }

  .dash-move { animation: dash .7s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: 100px; } }

  .speed { stroke: #fff; stroke-linecap: round; opacity: 0; animation: zip 1.6s linear infinite; }
  .speed:nth-of-type(2) { animation-delay: .45s; }
  .speed:nth-of-type(3) { animation-delay: .95s; }
  @keyframes zip {
    0%   { transform: translateX(60px);   opacity: 0; }
    20%  { opacity: .8; }
    100% { transform: translateX(-150px); opacity: 0; }
  }

  .puff { fill: #efe7d6; transform-box: fill-box; transform-origin: center; animation: puff 1.4s ease-out infinite; }
  .puff:nth-of-type(2) { animation-delay: .45s; }
  .puff:nth-of-type(3) { animation-delay: .9s; }
  @keyframes puff {
    0%   { transform: translate(0, 0) scale(.4);          opacity: .55; }
    100% { transform: translate(-52px, -24px) scale(1.6); opacity: 0; }
  }
</style>
</head>
<body>
<div class="stage">
  <svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-label="一只戴着头盔的鹈鹕在公路上骑自行车">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9fd8f0"/>
        <stop offset=".52" stop-color="#d5eef8"/>
        <stop offset="1" stop-color="#f0f9f2"/>
      </linearGradient>
      <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#fff7cf" stop-opacity=".95"/>
        <stop offset=".5" stop-color="#ffeaa8" stop-opacity=".45"/>
        <stop offset="1" stop-color="#ffeaa8" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8e9aa7"/>
        <stop offset=".25" stop-color="#7a8795"/>
        <stop offset="1" stop-color="#5f6d7b"/>
      </linearGradient>
      <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="1" stop-color="#efe8da"/>
      </linearGradient>
      <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#3ec0ad"/>
        <stop offset="1" stop-color="#1f8478"/>
      </linearGradient>
      <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2=".35">
        <stop offset="0" stop-color="#ffc65c"/>
        <stop offset="1" stop-color="#f09a3e"/>
      </linearGradient>

      <clipPath id="bodyClip">
        <ellipse cx="364" cy="210" rx="86" ry="64" transform="rotate(-12 364 210)"/>
      </clipPath>

      <g id="cloudShape" fill="#ffffff">
        <ellipse cx="0" cy="10" rx="46" ry="20"/>
        <ellipse cx="30" cy="0" rx="30" ry="22"/>
        <ellipse cx="-34" cy="4" rx="26" ry="16"/>
        <ellipse cx="6" cy="-12" rx="26" ry="18"/>
      </g>
    </defs>

    <!-- 天空 -->
    <rect width="900" height="560" fill="url(#skyGrad)"/>
    <circle cx="762" cy="116" r="140" fill="url(#sunGlow)"/>
    <circle cx="762" cy="116" r="45" fill="#fff5c9"/>
    <circle cx="762" cy="116" r="58" fill="none" stroke="#ffeab0" stroke-width="3" opacity=".55"/>

    <!-- 云 -->
    <g class="cloud"><g transform="translate(150 122) scale(.95)"><use href="#cloudShape"/></g></g>
    <g class="cloud b"><g transform="translate(410 74) scale(.62)"><use href="#cloudShape"/></g></g>
    <g class="cloud c"><g transform="translate(672 208) scale(.78)"><use href="#cloudShape"/></g></g>
    <g class="cloud b" opacity=".7"><g transform="translate(52 236) scale(.5)"><use href="#cloudShape"/></g></g>

    <!-- 远山 -->
    <path d="M0,436 C110,382 190,404 286,428 C380,452 462,368 566,384 C672,400 748,364 900,402 L900,470 L0,470 Z" fill="#b9dfc9"/>
    <path d="M0,456 C120,420 226,446 330,448 C458,451 546,410 668,428 C768,442 838,436 900,446 L900,478 L0,478 Z" fill="#93cdaa"/>

    <!-- 公路 -->
    <rect x="0" y="458" width="900" height="102" fill="url(#roadGrad)"/>
    <rect x="0" y="458" width="900" height="5" fill="#c3d3c0" opacity=".5"/>
    <line x1="-60" y1="522" x2="960" y2="522" stroke="#f2f5f2" stroke-width="7" stroke-linecap="round" stroke-dasharray="46 54" opacity=".8" class="dash-move"/>
    <line x1="-60" y1="498" x2="960" y2="498" stroke="#e9eef0" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 17" opacity=".3" class="dash-move"/>

    <!-- 影子 -->
    <ellipse cx="462" cy="463" rx="242" ry="12" fill="#233a46" opacity=".16"/>

    <!-- 速度线 -->
    <g fill="none">
      <line x1="150" y1="236" x2="222" y2="236" stroke-width="6" class="speed"/>
      <line x1="112" y1="300" x2="176" y2="300" stroke-width="5" class="speed"/>
      <line x1="168" y1="368" x2="216" y2="368" stroke-width="5" class="speed"/>
    </g>

    <!-- 尘土 -->
    <g>
      <circle cx="252" cy="452" r="7" class="puff"/>
      <circle cx="236" cy="458" r="9" class="puff"/>
      <circle cx="262" cy="446" r="5" class="puff"/>
    </g>

    <!-- ============ 自行车 + 鹈鹕 ============ -->

    <!-- 远侧腿（在车架后面） -->
    <path fill="none" stroke="#d18b3e" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"
          d="M372,270 L430,316 L425,375">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite" calcMode="linear"
               keyTimes="0;.25;.5;.75;1"
               values="M372,270 L430,316 L425,375; M372,270 L438,292 L455,345; M372,270 L444,310 L485,375; M372,270 L432,332 L455,405; M372,270 L430,316 L425,375"/>
    </path>

    <!-- 远侧曲柄 + 脚踏 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 455 375" to="360 455 375" dur="1.6s" repeatCount="indefinite"/>
      <line x1="455" y1="375" x2="425" y2="375" stroke="#8d99a3" stroke-width="7" stroke-linecap="round"/>
      <g transform="translate(425 375)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.6s" repeatCount="indefinite"/>
          <rect x="-14" y="4" width="28" height="6" rx="3" fill="#2f3b44"/>
          <path d="M-12,-4 C-6,-12 8,-12 18,-6 L22,-2 L20,4 C8,7 -4,7 -12,3 Z" fill="#d18b3e" stroke="#b87829" stroke-width="1.5"/>
        </g>
      </g>
    </g>

    <!-- 后轮 -->
    <g>
      <circle cx="300" cy="374" r="80" fill="none" stroke="#2f3542" stroke-width="13"/>
      <circle cx="300" cy="374" r="71" fill="none" stroke="#cfd9dd" stroke-width="4"/>
      <g stroke="#c3ced4" stroke-width="2.6" opacity=".95">
        <animateTransform attributeName="transform" type="rotate" from="0 300 374" to="360 300 374" dur=".85s" repeatCount="indefinite"/>
        <line x1="300" y1="302" x2="300" y2="446"/>
        <line x1="300" y1="302" x2="300" y2="446" transform="rotate(30 300 374)"/>
        <line x1="300" y1="302" x2="300" y2="446" transform="rotate(60 300 374)"/>
        <line x1="300" y1="302" x2="300" y2="446" transform="rotate(90 300 374)"/>
        <line x1="300" y1="302" x2="300" y2="446" transform="rotate(120 300 374)"/>
        <line x1="300" y1="302" x2="300" y2="446" transform="rotate(150 300 374)"/>
        <circle cx="300" cy="312" r="4.5" fill="#ffb703" stroke="none"/>
      </g>
      <circle cx="300" cy="374" r="10" fill="#5b6770"/>
      <circle cx="300" cy="374" r="4" fill="#98a5ad"/>
    </g>

    <!-- 前轮 -->
    <g>
      <circle cx="620" cy="374" r="80" fill="none" stroke="#2f3542" stroke-width="13"/>
      <circle cx="620" cy="374" r="71" fill="none" stroke="#cfd9dd" stroke-width="4"/>
      <g stroke="#c3ced4" stroke-width="2.6" opacity=".95">
        <animateTransform attributeName="transform" type="rotate" from="0 620 374" to="360 620 374" dur=".85s" repeatCount="indefinite"/>
        <line x1="620" y1="302" x2="620" y2="446"/>
        <line x1="620" y1="302" x2="620" y2="446" transform="rotate(30 620 374)"/>
        <line x1="620" y1="302" x2="620" y2="446" transform="rotate(60 620 374)"/>
        <line x1="620" y1="302" x2="620" y2="446" transform="rotate(90 620 374)"/>
        <line x1="620" y1="302" x2="620" y2="446" transform="rotate(120 620 374)"/>
        <line x1="620" y1="302" x2="620" y2="446" transform="rotate(150 620 374)"/>
        <circle cx="620" cy="312" r="4.5" fill="#ffb703" stroke="none"/>
      </g>
      <circle cx="620" cy="374" r="10" fill="#5b6770"/>
      <circle cx="620" cy="374" r="4" fill="#98a5ad"/>
    </g>

    <!-- 后飞轮 -->
    <circle cx="300" cy="374" r="12" fill="none" stroke="#4a5560" stroke-width="4" stroke-dasharray="2.5 2.5"/>

    <!-- 链条 -->
    <path d="M300,364 L455,349 A26,26 0 0 1 455,401 L300,384 A10,10 0 0 1 300,364 Z"
          fill="none" stroke="#59646e" stroke-width="3.2" stroke-dasharray="5 3.5" opacity=".75">
      <animate attributeName="stroke-dashoffset" from="0" to="8.5" dur=".5s" repeatCount="indefinite"/>
    </path>

    <!-- 车架 -->
    <g fill="none" stroke="url(#frameGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
      <path d="M300,374 L455,375"/>
      <path d="M300,374 L368,282"/>
      <path d="M368,282 L455,375"/>
      <path d="M368,282 L540,262"/>
      <path d="M455,375 L552,300"/>
      <path d="M540,262 L552,300"/>
    </g>
    <g fill="none" stroke="#7fe0cf" stroke-width="3" stroke-linecap="round" opacity=".5">
      <path d="M378,278 L530,261"/>
      <path d="M388,300 L446,364"/>
    </g>

    <!-- 前叉 -->
    <path d="M552,300 C566,318 604,332 620,374" fill="none" stroke="#1f7a70" stroke-width="12" stroke-linecap="round"/>

    <!-- 车把 + 车铃 -->
    <line x1="540" y1="262" x2="532" y2="238" stroke="#9aa7ae" stroke-width="9" stroke-linecap="round"/>
    <path d="M506,250 C518,228 548,226 564,244" fill="none" stroke="#4c5a64" stroke-width="9" stroke-linecap="round"/>
    <rect x="494" y="241" width="22" height="13" rx="6.5" fill="#25313a" transform="rotate(-24 505 247)"/>
    <rect x="553" y="238" width="22" height="13" rx="6.5" fill="#25313a" transform="rotate(22 564 244)"/>
    <circle cx="522" cy="227" r="8.5" fill="#f6c445" stroke="#c99a26" stroke-width="2"/>
    <path d="M515,229 a7,7 0 0 1 12,0" fill="none" stroke="#c99a26" stroke-width="1.5"/>

    <!-- 水壶 -->
    <g transform="translate(498 334) rotate(-38)">
      <rect x="-9" y="-24" width="18" height="40" rx="7" fill="#ef476f" stroke="#d63d63" stroke-width="1.5"/>
      <rect x="-9" y="-24" width="18" height="9" rx="4.5" fill="#d63d63"/>
      <rect x="-5" y="-29" width="10" height="7" rx="3" fill="#2b3840"/>
    </g>

    <!-- 近侧腿 -->
    <path fill="none" stroke="#f0a65a" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"
          d="M380,266 L443,307 L485,375">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite" calcMode="linear"
               keyTimes="0;.25;.5;.75;1"
               values="M380,266 L443,307 L485,375; M380,266 L431,327 L455,405; M380,266 L421,311 L425,375; M380,266 L433,287 L455,345; M380,266 L443,307 L485,375"/>
    </path>

    <!-- 牙盘 + 近侧曲柄 + 脚踏 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 455 375" to="360 455 375" dur="1.6s" repeatCount="indefinite"/>
      <circle cx="455" cy="375" r="26" fill="none" stroke="#4d5a64" stroke-width="6" stroke-dasharray="4 5"/>
      <circle cx="455" cy="375" r="21" fill="#6b7882" stroke="#3d4a54" stroke-width="3"/>
      <circle cx="455" cy="375" r="9" fill="#3d4a54"/>
      <circle cx="455" cy="375" r="3.5" fill="#aebac1"/>
      <line x1="455" y1="375" x2="485" y2="375" stroke="#c9d3d8" stroke-width="7.5" stroke-linecap="round"/>
      <g transform="translate(485 375)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.6s" repeatCount="indefinite"/>
          <rect x="-15" y="4" width="30" height="6.5" rx="3.25" fill="#37474f"/>
          <path d="M-12,-4 C-6,-12 8,-12 18,-6 L22,-2 L20,4 C8,7 -4,7 -12,3 Z" fill="#f2a03d" stroke="#d9822b" stroke-width="1.6"/>
          <path d="M-2,-6 L0,2 M6,-7 L9,2" stroke="#d9822b" stroke-width="1.4" fill="none" opacity=".7"/>
        </g>
      </g>
    </g>

    <!-- ============ 鹈鹕 ============ -->
    <g class="rider-bob">

      <!-- 尾羽 -->
      <path d="M312,218 L252,196 L286,226 L246,232 L288,244 L266,260 L314,252 Z"
            fill="#ece4d3" stroke="#dcd2bd" stroke-width="2.5" stroke-linejoin="round"/>

      <!-- 身体 -->
      <ellipse cx="364" cy="210" rx="86" ry="64" transform="rotate(-12 364 210)"
               fill="url(#bodyGrad)" stroke="#e7dfce" stroke-width="2.5"/>
      <g clip-path="url(#bodyClip)">
        <ellipse cx="382" cy="252" rx="72" ry="32" fill="#e9e1d1" opacity=".75"/>
        <ellipse cx="410" cy="182" rx="30" ry="42" fill="#ffffff" opacity=".65"/>
      </g>

      <!-- 翅膀 -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          values="-5 410 178; 4 410 178; -5 410 178" dur="2.4s" repeatCount="indefinite"/>
        <path d="M410,172 C382,182 350,204 316,232 C302,244 300,254 310,258 C344,264 382,250 404,228 C418,212 420,188 410,172 Z"
              fill="#f8f1e1" stroke="#d5c7ac" stroke-width="3" stroke-linejoin="round"/>
        <g fill="none" stroke="#d5c7ac" stroke-width="2.2" stroke-linecap="round">
          <path d="M392,196 C376,214 362,232 350,248"/>
          <path d="M374,206 C360,222 348,238 338,252"/>
          <path d="M356,216 C344,230 334,242 326,254"/>
        </g>
        <path d="M312,257 C344,263 382,250 404,228" fill="none" stroke="#5c646b" stroke-width="4.5" stroke-linecap="round" opacity=".4"/>
      </g>

      <!-- 脖子 -->
      <path d="M380,202 C384,158 410,112 458,92 L494,126 C454,142 428,170 420,210 Z"
            fill="#fbf7ee" stroke="#e7dfce" stroke-width="2.5" stroke-linejoin="round"/>

      <!-- 围巾飘带 -->
      <path d="M404,186 C374,194 344,204 316,222 C340,218 364,212 386,206 C400,202 408,192 404,186 Z" fill="#cf3a5b">
        <animate attributeName="d" dur="1.3s" repeatCount="indefinite" begin="-0.4s" calcMode="linear"
                 values="M404,186 C374,194 344,204 316,222 C340,218 364,212 386,206 C400,202 408,192 404,186 Z; M404,186 C372,188 342,198 314,210 C338,212 362,210 386,206 C400,202 408,192 404,186 Z; M404,186 C374,194 344,204 316,222 C340,218 364,212 386,206 C400,202 408,192 404,186 Z"/>
      </path>
      <path d="M400,194 C372,204 346,216 316,232 C342,228 366,218 388,208 C402,202 408,198 400,194 Z" fill="#ef476f" stroke="#d63d63" stroke-width="1.5">
        <animate attributeName="d" dur="1.1s" repeatCount="indefinite" calcMode="linear"
                 values="M400,194 C372,204 346,216 316,232 C342,228 366,218 388,208 C402,202 408,198 400,194 Z; M400,194 C370,200 344,210 318,222 C344,222 368,214 388,208 C402,202 408,198 400,194 Z; M400,194 C372,204 346,216 316,232 C342,228 366,218 388,208 C402,202 408,198 400,194 Z"/>
      </path>
      <!-- 围巾一圈 + 结 -->
      <path d="M388,188 C398,202 424,200 436,182 C428,172 406,174 394,180 Z"
            fill="#ef476f" stroke="#d63d63" stroke-width="1.5"/>
      <ellipse cx="400" cy="191" rx="10" ry="8" fill="#ef476f" stroke="#d63d63" stroke-width="1.5" transform="rotate(18 400 191)"/>

      <!-- 冠羽 -->
      <path d="M466,100 C448,78 422,74 412,82 C430,86 442,94 448,108 Z"
            fill="#f3ecdc" stroke="#e0d7c4" stroke-width="2" stroke-linejoin="round"/>

      <!-- 头 -->
      <circle cx="478" cy="102" r="33" fill="#fbf7ee" stroke="#e7dfce" stroke-width="2.5"/>
      <ellipse cx="474" cy="120" rx="8" ry="4.5" fill="#f6a6a6" opacity=".5"/>
      <circle cx="482" cy="96" r="6.5" fill="#ffffff"/>
      <circle cx="483.5" cy="96.5" r="3.8" fill="#24303c"/>
      <circle cx="484.8" cy="94.8" r="1.3" fill="#ffffff"/>

      <!-- 喙 + 喉囊 -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          values="-1.4 508 112; 1.4 508 112; -1.4 508 112" dur="1.6s" repeatCount="indefinite"/>
        <path d="M504,84 C552,84 598,100 640,128 C642,131 641,135 636,137 C610,146 582,154 554,154 C530,154 508,146 500,132 C492,124 492,100 504,84 Z"
              fill="url(#beakGrad)"/>
        <path d="M504,84 C552,84 598,100 640,128 C642,131 641,135 636,137 C610,146 582,154 554,154 C530,154 508,146 500,132 C492,124 492,100 504,84 Z"
              fill="none" stroke="#dd8a2b" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M504,100 C550,102 592,112 634,131" fill="none" stroke="#d98b2b" stroke-width="2.2" opacity=".8"/>
        <ellipse cx="566" cy="140" rx="34" ry="9" fill="#ffe09a" opacity=".3" transform="rotate(6 566 140)"/>
        <ellipse cx="524" cy="95" rx="4" ry="2.2" fill="#b06a1c" opacity=".7" transform="rotate(12 524 95)"/>
      </g>

      <!-- 头盔 -->
      <path d="M446,84 C444,44 512,40 510,86 C494,76 462,76 446,84 Z"
            fill="#2a9d8f" stroke="#1f7a70" stroke-width="2"/>
      <path d="M458,74 C460,52 494,44 504,52" fill="none" stroke="#63c7b9" stroke-width="4" stroke-linecap="round" opacity=".8"/>
      <path d="M468,62 L474,50 M490,60 L496,48" stroke="#1f7a70" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M508,78 C518,80 530,86 534,90 C522,94 512,92 506,86 Z" fill="#22897c"/>
      <path d="M450,86 C454,106 460,122 468,132" fill="none" stroke="#1f7a70" stroke-width="3" stroke-linecap="round" opacity=".85"/>

    </g>
  </svg>
</div>
</body>
</html>
