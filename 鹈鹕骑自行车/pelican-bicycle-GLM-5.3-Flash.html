<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑行 · SVG 2D 动画</title>
<style>
  :root { --ink:#22313a; --teal:#1e5461; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 28px 16px;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: linear-gradient(160deg, #eef6fa, #dcebf3 55%, #cfe0ea);
    color: var(--ink);
  }
  .card {
    width: min(94vw, 880px);
    background: #fff; border-radius: 18px;
    box-shadow: 0 18px 50px rgba(30, 84, 97, .18);
    padding: 18px 18px 12px;
  }
  h1 { margin: 2px 4px 12px; font-size: 20px; letter-spacing: .5px; }
  svg { display: block; width: 100%; height: auto; border-radius: 12px; }
  .controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 12px 6px 2px; }
  button {
    font: inherit; padding: 7px 22px; border: 0; border-radius: 999px;
    background: var(--teal); color: #fff; cursor: pointer;
  }
  button:hover { background: #2a7285; }
  label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #4c5c66; }
  input[type=range] { width: 220px; accent-color: var(--teal); }
  .spd { min-width: 78px; font-variant-numeric: tabular-nums; }
  .note { font-size: 12.5px; color: #7c8b94; margin: 8px 4px 2px; }
</style>
</head>

  <p class="note">纯 SVG + JavaScript 逐帧驱动：车轮与飞轮旋转、双腿两段式 IK 踩踏、脚踏保持水平、牙盘随曲柄转动、链条虚线流动、地面 / 远山 / 云朵三层视差，鹈鹕身体随踩踏轻微起伏。</p>

  <script>
  (function () {
    "use strict";
    var $ = function (id) { return document.getElementById(id); };
    var TAU = Math.PI * 2, DEG = 180 / Math.PI;
    var WHEEL_R = 90, CRANK_R = 34, GEAR = 2.2, RING_R = 26, DASH = 9;
    var BB = { x: 396, y: 452 };
    var HIP_N = { x: 356, y: 312 }, HIP_F = { x: 338, y: 296 };
    var L1 = 102, L2 = 100;

    var el = {
      wheelR: $("wheelRear"), wheelF: $("wheelFront"), cog: $("cogSpin"),
      crankN: $("crankNear"), crankF: $("crankFar"),
      pedalN: $("pedalNear"), pedalF: $("pedalFar"), ring: $("ringSpin"),
      chainT: $("chainTop"), chainB: $("chainBottom"),
      road: $("roadScroll"), hill: $("hillScroll"), cloud: $("cloudScroll"),
      rider: $("rider"),
      thN: $("thighNear"), shN: $("shinNear"), ftN: $("footNear"),
      thF: $("thighFar"), shF: $("shinFar"), ftF: $("footFar"),
      birds: [
        { g: $("bird1"), w: $("bird1w"), off: 0,   y: 150, s: 1 },
        { g: $("bird2"), w: $("bird2w"), off: 430, y: 120, s: 0.75 },
        { g: $("bird3"), w: $("bird3w"), off: 760, y: 178, s: 0.6 }
      ]
    };

    var speed = 220, running = true;
    var wheelAng = 0, crankAng = 0, groundX = 0, chainX = 0, animT = 0;
    var last = performance.now();

    var out = { thigh: "", shin: "" };
    function ik(hipX, hipY, tx, ty) {
      var dx = tx - hipX, dy = ty - hipY;
      var d = Math.hypot(dx, dy);
      d = Math.min(d, L1 + L2 - 0.5);
      d = Math.max(d, Math.abs(L1 - L2) + 0.5);
      var a1 = Math.atan2(dy, dx);
      var a2 = Math.acos(Math.max(-1, Math.min(1,
        (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d))));
      var ka = a1 - a2;
      var kx = hipX + L1 * Math.cos(ka), ky = hipY + L1 * Math.sin(ka);
      out.thigh = "M" + hipX.toFixed(1) + " " + hipY.toFixed(1) +
                  " L" + kx.toFixed(1) + " " + ky.toFixed(1);
      out.shin  = "M" + kx.toFixed(1) + " " + ky.toFixed(1) +
                  " L" + tx.toFixed(1) + " " + ty.toFixed(1);
    }

    function frame(now) {
      var dt = (now - last) / 1000; last = now;
      if (dt > 0.05) dt = 0.05;
      if (running) {
        animT += dt;
        var w = speed / WHEEL_R;
        wheelAng = (wheelAng + w * dt) % TAU;
        crankAng = (crankAng + w * dt / GEAR) % TAU;
        groundX = (groundX + speed * dt) % 800;
        chainX = (chainX + w / GEAR * RING_R * dt) % DASH;
      }
      var wd = (wheelAng * DEG).toFixed(2), cd = crankAng * DEG;

      el.wheelR.setAttribute("transform", "translate(240 440) rotate(" + wd + ")");
      el.wheelF.setAttribute("transform", "translate(610 440) rotate(" + wd + ")");
      el.cog.setAttribute("transform", "rotate(" + wd + ")");
      el.ring.setAttribute("transform", "rotate(" + cd.toFixed(2) + ")");
      el.crankN.setAttribute("transform", "rotate(" + cd.toFixed(2) + ")");
      el.crankF.setAttribute("transform", "rotate(" + ((cd + 180) % 360).toFixed(2) + ")");
      el.pedalN.setAttribute("transform", "translate(34 0) rotate(" + (-cd).toFixed(2) + ")");
      el.pedalF.setAttribute("transform", "translate(34 0) rotate(" + (-cd - 180).toFixed(2) + ")");
      el.chainT.setAttribute("stroke-dashoffset", chainX.toFixed(2));
      el.chainB.setAttribute("stroke-dashoffset", (-chainX).toFixed(2));
      el.road.setAttribute("transform", "translate(" + (-groundX).toFixed(1) + " 0)");
      el.hill.setAttribute("transform", "translate(" + (-(groundX * 0.25) % 800).toFixed(1) + " 0)");
      el.cloud.setAttribute("transform", "translate(" + (-(groundX * 0.08) % 800).toFixed(1) + " 0)");

      var dy = 2.2 * Math.sin(2 * crankAng + 0.8);
      el.rider.setAttribute("transform", "translate(0 " + dy.toFixed(2) + ")");

      var cnx = BB.x + CRANK_R * Math.cos(crankAng), cny = BB.y + CRANK_R * Math.sin(crankAng);
      var cfx = BB.x - CRANK_R * Math.cos(crankAng), cfy = BB.y - CRANK_R * Math.sin(crankAng);
      ik(HIP_N.x, HIP_N.y + dy, cnx, cny - 7);
      el.thN.setAttribute("d", out.thigh);
      el.shN.setAttribute("d", out.shin);
      el.ftN.setAttribute("transform", "translate(" + cnx.toFixed(1) + " " + (cny - 7).toFixed(1) + ")");
      ik(HIP_F.x, HIP_F.y + dy, cfx, cfy - 7);
      el.thF.setAttribute("d", out.thigh);
      el.shF.setAttribute("d", out.shin);
      el.ftF.setAttribute("transform", "translate(" + cfx.toFixed(1) + " " + (cfy - 7).toFixed(1) + ")");

      var i, b, x, y, f;
      for (i = 0; i < el.birds.length; i++) {
        b = el.birds[i];
        x = 830 - ((groundX * 0.3 + b.off) % 1000);
        y = b.y + 7 * Math.sin(animT * 1.1 + i * 1.9);
        b.g.setAttribute("transform", "translate(" + x.toFixed(1) + " " + y.toFixed(1) + ") scale(" + b.s + ")");
        f = (-7 - 5 * Math.sin(animT * 7 + i * 2.4)).toFixed(1);
        b.w.setAttribute("d", "M0 0 Q7 " + f + " 14 0 Q21 " + f + " 28 0");
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    $("btnPause").addEventListener("click", function () {
      running = !running;
      this.textContent = running ? "暂停" : "继续";
    });
    $("speed").addEventListener("input", function () {
      speed = +this.value;
      $("spdVal").textContent = this.value;
    });
  })();
  </script>
</main>
</body>
</html>
